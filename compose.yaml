services:
  vt-postgres:
    image: postgres:16-alpine
    container_name: voice-talent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voicetalent}
      POSTGRES_USER: ${POSTGRES_USER:-voicetalent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voicetalent_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voicetalent} -d ${POSTGRES_DB:-voicetalent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-talent-backend
    restart: unless-stopped
    depends_on:
      vt-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://vt-postgres:5432/${POSTGRES_DB:-voicetalent}
      DATABASE_USERNAME: ${POSTGRES_USER:-voicetalent}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-voicetalent_dev}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      STORAGE_MODE: ${STORAGE_MODE:-local}
      STORAGE_LOCAL_DIR: /app/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      REGISTRATION_ENFORCE_WINDOW: ${REGISTRATION_ENFORCE_WINDOW:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - db-net
      - app-net

networks:
  db-net:
    driver: bridge
    internal: true
  app-net:
    driver: bridge

volumes:
  pgdata:
  uploads_data:
