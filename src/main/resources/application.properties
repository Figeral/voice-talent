spring.application.name=voice-talent-backend
server.forward-headers-strategy=framework

# Database (PostgreSQL by default; override via env or use 'local' profile for H2)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:voicetalent;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Multipart / Upload limits (max 40MB video + overhead)
spring.servlet.multipart.max-file-size=45MB
spring.servlet.multipart.max-request-size=45MB

# Registration window (Douala time UTC+1)
app.registration.opens-at=${REGISTRATION_OPENS_AT:2026-11-25T00:00:00+01:00}
app.registration.closes-at=${REGISTRATION_CLOSES_AT:2026-11-27T23:59:59+01:00}
app.registration.enforce-window=${REGISTRATION_ENFORCE_WINDOW:true}
app.registration.birth-date-min=${BIRTH_DATE_MIN:1990-11-28}
app.registration.birth-date-max=${BIRTH_DATE_MAX:2008-11-27}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://candidature-voice-talents.vercel.app,http://localhost:3000}

# Storage ('local' for dev/standalone, 'supabase' for Supabase Storage)
app.storage.mode=${STORAGE_MODE:local}
app.storage.local-dir=${STORAGE_LOCAL_DIR:./uploads}
app.storage.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.storage.signing-secret=${STORAGE_SIGNING_SECRET:dev-local-signing-secret-change-in-prod}
app.storage.supabase-url=${SUPABASE_URL:}
app.storage.supabase-service-key=${SUPABASE_SERVICE_KEY:}
app.storage.bucket=${SUPABASE_BUCKET:saas_attachments}

# Cloudflare Turnstile
app.turnstile.enabled=${TURNSTILE_ENABLED:false}
app.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}

# Admin Basic Auth
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:changeme123}

# Email
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@voicetalent.cm}

# OpenAPI / Swagger UI
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
